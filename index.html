<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison Canis — Alta artesanía para perros</title>
  <meta name="description" content="Maison Canis: prendas artesanales de lujo para perros. Lana merino, cachemira y terciopelo, en series de treinta piezas.">
  <meta name="robots" content="noindex"><!-- maqueta provisional -->
  <meta name="theme-color" content="#16120f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316120f'/%3E%3Ctext x='16' y='22' font-family='serif' font-size='17' text-anchor='middle' fill='%23F5F0E8'%3EMC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-loading">

  <!-- Entrada: sello -->
  <div class="loader" id="loader" aria-hidden="true">
    <svg class="loader__seal" viewBox="0 0 120 120" width="120" height="120">
      <circle class="loader__ring" cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle class="loader__ring loader__ring--in" cx="60" cy="60" r="48" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="2 4"/>
      <text class="loader__mc" x="60" y="72" text-anchor="middle">MC</text>
    </svg>
  </div>

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="thread" id="thread" aria-hidden="true"><i class="thread__fill" id="threadFill"></i><b class="thread__needle" id="threadNeedle"></b></div>

  <header class="header" id="header">
    <a href="#inicio" class="logo" data-lenis-link>Maison Canis</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="nav">
      <span></span><span></span>
    </button>
    <nav class="nav" id="nav" aria-label="Principal">
      <a href="#colecciones" data-lenis-link>Colecciones</a>
      <a href="#atelier" data-lenis-link>Atelier</a>
      <a href="#tallas" data-lenis-link>Tallas</a>
      <a href="#contacto" data-lenis-link>Contacto</a>
    </nav>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="inicio">
      <canvas class="hero__canvas" id="heroCanvas" aria-hidden="true"></canvas>
      <div class="hero__veil"></div>
      <div class="hero__content" id="heroContent">
        <h1 class="hero__title" id="heroTitle" aria-label="Maison Canis"></h1>
        <div class="hero__row">
          <p class="hero__tagline" id="heroTagline"></p>
          <div class="hero__side">
            <p class="hero__season" id="heroSeason"></p>
            <a href="#colecciones" class="btn btn--light" data-lenis-link>Descubrir la colección</a>
          </div>
        </div>
      </div>
    </section>

    <!-- MANIFIESTO -->
    <section class="manifesto" id="manifiesto">
      <p class="manifesto__text" id="manifestoText"></p>
    </section>

    <!-- COLECCIONES: una escena fijada por colección -->
    <div id="stages"></div>

    <!-- ATELIER -->
    <section class="atelier" id="atelier">
      <div class="atelier__media">
        <div class="atelier__frame" id="atelierFrame">
          <div class="swatch" data-tone="tabaco" id="atelierImg"></div>
        </div>
      </div>
      <div class="atelier__body">
        <h2 class="title" id="atelierTitle"></h2>
        <p class="lead" id="atelierText"></p>
        <ul class="pillars" id="atelierPillars"></ul>
      </div>
    </section>

    <!-- TALLAS -->
    <section class="sizing" id="tallas">
      <div class="sizing__intro">
        <h2 class="title" id="sizingTitle"></h2>
        <p class="lead" id="sizingText"></p>
      </div>

      <div class="sizing__lab">
        <svg class="dog" id="dog" viewBox="0 0 600 360" role="img" aria-label="Dibujo técnico de un perro con las tres medidas: cuello, pecho y lomo">
          <line class="dog__ground" x1="30" y1="312" x2="570" y2="312"/>
          <g id="dogGroup">
            <path class="dog__body" d="
              M128,128 C160,104 215,96 262,100
              C305,104 335,110 362,112
              C392,108 420,92 446,80
              C458,76 470,80 484,92
              C498,104 514,112 526,118
              C534,122 534,132 524,134
              C506,138 486,134 470,128
              C452,134 438,152 428,176
              C424,200 418,224 408,246
              L402,300 C402,306 408,310 418,311 L394,312 L390,300
              L378,254
              C350,250 300,232 250,214
              C238,234 224,260 214,288
              L214,302 C216,308 222,311 230,311 L204,312 L200,300
              C198,286 192,276 184,266
              C166,244 146,226 138,196
              C132,170 130,150 128,128 Z"/>
            <path class="dog__ear" d="M452,82 C440,68 422,66 408,76 C422,84 436,90 446,98"/>
            <path class="dog__tail" d="M128,128 C108,152 84,200 62,238"/>
            <circle class="dog__eye" cx="480" cy="101" r="2.4"/>

            <!-- cotas -->
            <g class="cota" id="cotaBack">
              <line x1="132" y1="78" x2="362" y2="78"/>
              <line x1="132" y1="70" x2="132" y2="86"/><line x1="362" y1="70" x2="362" y2="86"/>
              <text x="247" y="68" text-anchor="middle">C</text>
            </g>
            <g class="cota" id="cotaChest">
              <line x1="388" y1="114" x2="388" y2="252"/>
              <line x1="380" y1="114" x2="396" y2="114"/><line x1="380" y1="252" x2="396" y2="252"/>
              <text x="374" y="190" text-anchor="end">B</text>
            </g>
            <g class="cota" id="cotaNeck">
              <line x1="404" y1="100" x2="440" y2="154"/>
              <line x1="397" y1="104" x2="411" y2="94"/><line x1="433" y1="159" x2="447" y2="149"/>
              <text x="412" y="140" text-anchor="end">A</text>
            </g>
          </g>
        </svg>
      </div>

      <div class="sizing__panel">
        <div class="sizes" id="sizes" role="radiogroup" aria-label="Talla"></div>
        <dl class="readout" id="readout"></dl>
        <p class="sizing__breeds" id="sizingBreeds" aria-live="polite"></p>
        <p class="sizing__tip" id="sizingTip"></p>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="contact" id="contacto">
      <div class="contact__intro">
        <h2 class="title title--light" id="contactTitle"></h2>
        <p class="lead lead--light" id="contactText"></p>
      </div>
      <form class="form" id="waitlistForm" novalidate>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="raza">Raza de su perro</label>
          <input type="text" id="raza" name="raza" required>
        </div>
        <p class="form__error" id="formError" role="alert" hidden></p>
        <button type="submit" class="btn btn--light">Unirme a la lista</button>
        <div class="form__success" id="formSuccess" role="status" hidden>
          <svg class="stamp" viewBox="0 0 120 120" width="88" height="88" aria-hidden="true">
            <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="1"/>
            <circle cx="60" cy="60" r="48" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="2 4"/>
            <text x="60" y="72" text-anchor="middle">MC</text>
          </svg>
          <p id="formSuccessText"></p>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <a href="#inicio" class="logo logo--footer" data-lenis-link>Maison Canis</a>
    <ul class="social" id="social"></ul>
    <p class="footer__copy">&copy; <span id="year">2026</span> Maison Canis. Todos los derechos reservados.</p>
  </footer>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>
  <script src="js/vendor/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/hero3d.js"></script>
  <script src="js/stage3d.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
